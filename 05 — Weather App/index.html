<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --text-light: #64748b;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .weather-container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 420px;
            padding: 30px;
            text-align: center;
        }

        h1 {
            font-size: 1.75rem;
            margin-bottom: 24px;
            color: var(--text-color);
        }

        .control-group {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        select {
            flex: 1;
            padding: 10px 14px;
            font-size: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: #fff;
            color: var(--text-color);
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        select:focus {
            border-color: var(--primary-color);
        }

        button {
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            background-color: var(--primary-color);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .weather-card {
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            background: linear-gradient(to bottom, #ffffff, #f1f5f9);
        }

        #location {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .weather-main-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        #weather-icon {
            width: 64px;
            height: 64px;
        }

        #weather-main {
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--text-light);
            text-transform: capitalize;
        }

        .temp-display {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 5px;
            color: var(--primary-color);
        }

        .feels-like-text {
            font-size: 0.95rem;
            color: var(--text-light);
            margin-bottom: 20px;
        }

        .weather-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            text-align: left;
            font-size: 0.9rem;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }

        .detail-item {
            background: #fff;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .detail-label {
            color: var(--text-light);
            font-size: 0.8rem;
            margin-bottom: 2px;
        }

        .detail-value {
            font-weight: 600;
            color: var(--text-color);
        }
    </style>
</head>
<body>

    <div class="weather-container">
        <h1>Weather App</h1>
        
        <div class="control-group">
            <select id="city-select">
                <option value=""></option>
                <option value="new york">New York</option>
                <option value="los angeles">Los Angeles</option>
                <option value="chicago">Chicago</option>
                <option value="paris">Paris</option>
                <option value="tokyo">Tokyo</option>
                <option value="london">London</option>
            </select>
            <button id="get-weather-btn">Get Weather</button>
        </div>

        <div class="weather-card">
            <div id="location">Select a city</div>
            
            <div class="weather-main-section">
                <img id="weather-icon" src="" alt="" style="display: none;">
                <div id="weather-main">--</div>
            </div>

            <div class="temp-display"><span id="main-temperature">--</span>°C</div>
            <div class="feels-like-text">Feels like: <span id="feels-like">--</span>°C</div>

            <div class="weather-details">
                <div class="detail-item">
                    <div class="detail-label">Humidity</div>
                    <div class="detail-value"><span id="humidity">--</span>%</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Wind Speed</div>
                    <div class="detail-value"><span id="wind">--</span> m/s</div>
                </div>
                <div class="detail-item" style="grid-column: span 2;">
                    <div class="detail-label">Wind Gust</div>
                    <div class="detail-value"><span id="wind-gust">--</span> m/s</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function getWeather(city) {
            try {
                const response = await fetch(`https://weather-proxy.freecodecamp.rocks/api/city/${city}`);
                if (!response.ok) {
                    throw new Error(`Failed to fetch weather for ${city}`);
                }
                const data = await response.json();
                return data;
            } catch (error) {
                console.log(error);
                return undefined;
            }
        }

        async function showWeather(city) {
            const data = await getWeather(city);
            if (!data) {
                alert("Something went wrong, please try again later");
                return;
            }

            const iconEl = document.getElementById("weather-icon");
            if (data.weather && data.weather[0] && data.weather[0].icon) {
                iconEl.src = data.weather[0].icon;
                iconEl.style.display = "inline-block";
            } else {
                iconEl.style.display = "none";
            }

            document.getElementById("location").textContent = data.name !== undefined ? data.name : "N/A";
            document.getElementById("weather-main").textContent = data.weather && data.weather[0] && data.weather[0].main !== undefined ? data.weather[0].main : "N/A";
            document.getElementById("main-temperature").textContent = data.main && data.main.temp !== undefined ? data.main.temp : "N/A";
            document.getElementById("feels-like").textContent = data.main && data.main.feels_like !== undefined ? data.main.feels_like : "N/A";
            document.getElementById("humidity").textContent = data.main && data.main.humidity !== undefined ? data.main.humidity : "N/A";
            document.getElementById("wind").textContent = data.wind && data.wind.speed !== undefined ? data.wind.speed : "N/A";
            document.getElementById("wind-gust").textContent = data.wind && data.wind.gust !== undefined ? data.wind.gust : "N/A";
        }

        document.getElementById("get-weather-btn").addEventListener("click", () => {
            const selectedCity = document.getElementById("city-select").value;
            if (!selectedCity) {
                return;
            }
            showWeather(selectedCity);
        });
    </script>
</body>
</html>
